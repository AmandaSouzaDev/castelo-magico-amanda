
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Amanda Souza | Castelo Mágico</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Poppins', sans-serif;
    background:
      radial-gradient(circle at 50% 40%, #65209a, #210d3b 55%, #080511);
    color: white;
}

.castelo {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px 15px 35px;
    position: relative;
}

.estrelas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 15% 20%, white, transparent),
      radial-gradient(2px 2px at 80% 15%, #ffd76a, transparent),
      radial-gradient(3px 3px at 65% 70%, white, transparent),
      radial-gradient(2px 2px at 25% 80%, #ffb5e8, transparent),
      radial-gradient(2px 2px at 90% 85%, white, transparent);
    background-size: 250px 250px;
    animation: brilhar 4s infinite alternate;
}

@keyframes brilhar {
    from { opacity: .35; }
    to { opacity: 1; }
}

.coroa {
    font-size: 48px;
    filter: drop-shadow(0 0 15px gold);
    margin-bottom: 12px;
    position: relative;
    z-index: 1;
}

h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(38px, 8vw, 76px);
    font-weight: 900;
    color: #ffe6a0;
    text-shadow: 0 0 12px #ffbd32, 0 0 35px #d68bff;
    letter-spacing: 5px;
    position: relative;
    z-index: 1;
}

.subtitulo {
    margin: 15px 0 28px;
    color: #ffd9f3;
    letter-spacing: 3px;
    font-size: 13px;
    position: relative;
    z-index: 1;
}

/* PORTÃO GRANDE */

.portao {
    width: min(760px, 92vw);
    height: clamp(360px, 52vh, 520px);
    display: flex;
    border: 6px solid #b99550;
    border-radius: 390px 390px 12px 12px;
    overflow: hidden;
    box-shadow:
        0 12px 35px rgba(0,0,0,.65),
        0 0 25px rgba(255,215,106,.35);
    background: #21130e;
    position: relative;
    z-index: 2;
}

/* PORTAS DE MADEIRA */

.porta {
    width: 50%;
    height: 100%;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0px,
            rgba(0,0,0,.12) 3px,
            transparent 7px,
            rgba(255,255,255,.04) 18px
        ),
        linear-gradient(
            90deg,
            #24130d,
            #59351e 25%,
            #382014 55%,
            #704526 80%,
            #28160f
        );

    border: 4px solid #8c6638;
    position: relative;
    transition: transform 2s ease;
    box-shadow: inset 0 0 25px rgba(0,0,0,.7);
}

/* DETALHES DAS PORTAS */

.porta::before {
    content: "";
    position: absolute;
    inset: 25px 18px;
    border: 3px solid #9c753e;
    box-shadow:
        inset 0 0 15px rgba(0,0,0,.5),
        0 0 8px rgba(0,0,0,.4);
}

.porta::after {
    content: "";
    position: absolute;
    top: 52%;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: linear-gradient(
        135deg,
        #fff0b3,
        #a77b32,
        #e5c47c
    );
    box-shadow: 0 2px 5px #000;
}

.esquerda {
    border-radius: 380px 0 0 0;
}

.direita {
    border-radius: 0 380px 0 0;
}

.esquerda::after {
    right: 12%;
}

.direita::after {
    left: 12%;
}

/* ABERTURA DO PORTÃO */

.portao.aberto .esquerda {
    transform: translateX(-100%);
}

.portao.aberto .direita {
    transform: translateX(100%);
}

/* BOTÃO */

button {
    margin-top: 32px;
    padding: 16px 35px;
    border: 2px solid #ffe7a0;
    border-radius: 40px;
    background: linear-gradient(
        90deg,
        #f6c75b,
        #fff0b3,
        #d99a31
    );
    color: #321044;
    font-family: 'Cinzel', serif;
    font-weight: 900;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 0 22px #ffd76a;
    transition: .3s;
    position: relative;
    z-index: 3;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 35px #fff0a8;
}

.frase {
    margin-top: 22px;
    color: #f7c7ed;
    font-size: 13px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
}

/* CELULARES */

@media(max-width: 500px) {
    .portao {
        width: 94vw;
        height: 360px;
    }

    .subtitulo {
        letter-spacing: 1px;
        font-size: 11px;
    }

    h1 {
        letter-spacing: 2px;
    }

    button {
        font-size: 12px;
        padding: 14px 22px;
    }
}
</style>
</head>

<body>

<main class="castelo">

    <div class="estrelas"></div>

    <div class="coroa">👑</div>

    <p class="subtitulo">
        UM UNIVERSO DE CRIATIVIDADE, TECNOLOGIA E MAGIA
    </p>

    <h1>AMANDA SOUZA</h1>

    <p class="subtitulo">
        SEJA BEM-VINDO(A) AO MEU CASTELO
    </p>

    <div class="portao" id="portao">

        <div class="porta esquerda"></div>

        <div class="porta direita"></div>

    </div>

    <button onclick="entrar()">
        VAMOS ENTRAR NO MEU CASTELO?
    </button>

    <p class="frase">
        Um mundo de possibilidades espera por você...
    </p>

</main>

<script>

function entrar() {

    const portao = document.getElementById("portao");

    portao.classList.add("aberto");

    setTimeout(() => {

        alert("Bem-vindo(a)! Nossa próxima sala será aberta em breve.");

    }, 2100);

}

</script>

</body>
</html>
