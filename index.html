
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelo Mágico | Amanda Souza</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10051f;
    font-family: Georgia, serif;
}

.castelo {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(15,4,30,.08), rgba(15,4,30,.48)),
      url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png")
      center center / cover no-repeat;
}

.castelo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      circle at center,
      transparent 20%,
      rgba(20,3,38,.38) 100%
    );
    z-index: 2;
}

/* PORTÕES */

.portao {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 3;
    pointer-events: none;
}

.folha {
    width: 50%;
    height: 100%;
    background-image: url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png");
    background-repeat: no-repeat;
    background-size: 100vw 100vh;
    transition: transform 2.5s cubic-bezier(.75,0,.2,1);
}

.esquerda {
    background-position: left center;
}

.direita {
    background-position: right center;
}

.castelo.aberto .esquerda {
    transform: translateX(-100%);
}

.castelo.aberto .direita {
    transform: translateX(100%);
}

/* CONTEÚDO */

.conteudo {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 94%;
    text-align: center;
    color: white;
}

/* NOME MENOR, PRETO METÁLICO E DOURADO */

#nome {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 3px;

    font-size: clamp(25px, 5vw, 58px);
    font-weight: 900;
    letter-spacing: 2px;

    perspective: 700px;

    animation: brilhoNome 2.5s ease-in-out 1.5s infinite;
}

#nome span {
    display: inline-block;
    color: #171717;

    -webkit-text-stroke: 1.5px #ffd700;

    text-shadow:
        0 0 5px #fff5c2,
        0 0 10px #ffd700,
        0 0 20px #ffcc00,
        1px 1px 0 #ffffff,
        3px 3px 0 #b8860b,
        5px 5px 8px #000000;

    opacity: 0;
    transform-style: preserve-3d;

    animation: cair .75s cubic-bezier(.2,.8,.3,1) forwards;
}

@keyframes cair {
    0% {
        opacity: 0;
        transform:
            translateY(-220px)
            rotateX(100deg)
            rotateZ(-20deg)
            scale(1.5);
    }

    65% {
        opacity: 1;
        transform:
            translateY(15px)
            rotateX(-15deg)
            rotateZ(5deg)
            scale(1.08);
    }

    85% {
        transform:
            translateY(-5px)
            rotateX(5deg)
            scale(.98);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            rotateX(0)
            rotateZ(0)
            scale(1);
    }
}

@keyframes brilhoNome {
    0%, 100% {
        filter: brightness(1);
    }

    50% {
        filter: brightness(1.8);
    }
}

/* FRASE ILUMINADA */

.frase {
    font-size: clamp(13px, 2.2vw, 20px);
    margin-top: 22px;
    color: #fff9dc;
    letter-spacing: 2px;

    text-shadow:
        0 0 5px #ffffff,
        0 0 12px #ffe8a3,
        0 0 25px #ffd700,
        0 0 40px #ffffff;

    animation: brilhoFrase 2.5s ease-in-out infinite;
}

@keyframes brilhoFrase {
    0%, 100% {
        opacity: .85;
        filter: brightness(1);
    }

    50% {
        opacity: 1;
        filter: brightness(1.8);
        text-shadow:
            0 0 10px #ffffff,
            0 0 20px #fff2b0,
            0 0 35px #ffd700,
            0 0 55px #ffffff;
    }
}

/* ENTRAR NO MEU CASTELO - TEXTO LIVRE */

button {
    display: inline-block;
    margin-top: 32px;
    padding: 10px;

    border: none;
    background: transparent;

    color: #171717;
    font-size: clamp(15px, 2.2vw, 23px);
    font-weight: 900;
    letter-spacing: 3px;

    cursor: pointer;

    text-shadow:
        1px 1px 0 #ffffff,
        2px 2px 0 #aaaaaa,
        3px 3px 0 #555555,
        0 0 12px #ffffff,
        0 0 22px #cfcfcf;

    box-shadow: none;

    opacity: 0;
    animation: aparecerBotao .8s ease 2.2s forwards;
    transition: .3s;
}

@keyframes aparecerBotao {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.7);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

button:hover {
    transform: scale(1.12);
    text-shadow:
        1px 1px 0 #ffffff,
        3px 3px 0 #888888,
        0 0 20px #ffffff,
        0 0 35px #cccccc;
}

/* DESAPARECIMENTO AO ENTRAR */

.castelo.aberto .conteudo {
    opacity: 0;
    transition: opacity .8s ease;
}

/* CELULAR */

@media (max-width: 600px) {
    .folha {
        background-size: 100vw 100dvh;
    }

    #nome {
        font-size: clamp(23px, 7vw, 38px);
        letter-spacing: 1px;
        gap: 1px;
    }

    .frase {
        font-size: 13px;
        letter-spacing: 1px;
        line-height: 1.5;
    }

    button {
        font-size: 14px;
        letter-spacing: 2px;
    }
}
</style>
</head>

<body>

<div class="castelo" id="castelo">

    <div class="portao">
        <div class="folha esquerda"></div>
        <div class="folha direita"></div>
    </div>

    <div class="conteudo">

        <h1 id="nome"></h1>

        <p class="frase">
            Um mundo de conhecimento, criatividade e tecnologia
        </p>

        <button onclick="entrar()">
            ✨ ENTRAR NO MEU CASTELO ✨
        </button>

    </div>

</div>

<script>

/* LETRAS CAINDO UMA POR UMA */

const nome = "AMANDA SOUZA";
const elementoNome = document.getElementById("nome");

[...nome].forEach((letra, i) => {
    const span = document.createElement("span");

    span.textContent = letra === " " ? "\u00A0" : letra;
    span.style.animationDelay = (i * 0.15) + "s";

    elementoNome.appendChild(span);
});

/* ABERTURA DOS PORTÕES */

function entrar() {
    const castelo = document.getElementById("castelo");

    if (castelo.classList.contains("aberto")) return;

    castelo.classList.add("aberto");

    setTimeout(() => {
        window.location.href = "sobre.html";
    }, 2700);
}

</script>

</body>
</html>
