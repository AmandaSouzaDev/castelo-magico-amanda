
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Castelo Mágico | Amanda Souza</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10051f;
    font-family: Georgia, serif;
}

.castelo {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;

    background:
      linear-gradient(
        180deg,
        rgba(15,4,30,.08),
        rgba(15,4,30,.48)
      ),
      url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png")
      center center / cover no-repeat;
}

/* BRILHO DO CASTELO */

.castelo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;

    background: radial-gradient(
        circle at center,
        transparent 20%,
        rgba(20,3,38,.38) 100%
    );

    z-index: 2;
}

/* PORTÕES */

.portao {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 3;
    pointer-events: none;
}

.folha {
    width: 50%;
    height: 100%;

    background-image: url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png");

    background-repeat: no-repeat;
    background-size: 100vw 100vh;

    transition: transform 2.5s cubic-bezier(.75,0,.2,1);
}

.esquerda {
    background-position: left center;
}

.direita {
    background-position: right center;
}

.castelo.aberto .esquerda {
    transform: translateX(-100%);
}

.castelo.aberto .direita {
    transform: translateX(100%);
}

/* CONTEÚDO CENTRAL */

.conteudo {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 94%;
    text-align: center;
    color: white;
}

/* NOME AMANDA SOUZA */

#nome {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;

    gap: 3px;

    font-size: clamp(29px, 7vw, 76px);
    font-weight: 900;
    letter-spacing: 2px;

    perspective: 700px;
    white-space: normal;
}

#nome span {
    display: inline-block;

    color: #171717;

    -webkit-text-stroke: 1px #c7c7c7;

    text-shadow:
        1px 1px 0 #eeeeee,
        2px 2px 0 #999999,
        3px 3px 0 #666666,
        4px 4px 0 #292929,
        5px 5px 7px #000000,
        0 0 12px #ffffff;

    opacity: 0;

    transform-style: preserve-3d;

    animation: cair 0.75s cubic-bezier(.2,.8,.3,1) forwards;
}

@keyframes cair {

    0% {
        opacity: 0;
        transform:
            translateY(-220px)
            rotateX(100deg)
            rotateZ(-20deg)
            scale(1.5);
    }

    65% {
        opacity: 1;
        transform:
            translateY(15px)
            rotateX(-15deg)
            rotateZ(5deg)
            scale(1.08);
    }

    85% {
        transform:
            translateY(-5px)
            rotateX(5deg)
            scale(.98);
    }

    100% {
        opacity: 1;
        transform:
            translateY(0)
            rotateX(0)
            rotateZ(0)
            scale(1);
    }
}

/* FRASE */

.frase {
    font-size: clamp(13px, 2.5vw, 21px);
    margin-top: 22px;
    color: #ffffff;
    letter-spacing: 2px;

    text-shadow:
        0 0 8px #ffffff,
        0 0 18px #a83bff;
}

/* BOTÃO PRETO METÁLICO */

button {
    margin-top: 32px;

    padding: 17px 38px;

    border: 2px solid #c0c0c0;
    border-radius: 50px;

    background: linear-gradient(
        145deg,
        #050505,
        #454545,
        #080808
    );

    color: #ffffff;

    font-size: clamp(14px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 2px;

    cursor: pointer;

    text-shadow: 0 0 8px #ffffff;

    box-shadow:
        0 5px 0 #111111,
        0 8px 18px #000000,
        0 0 20px #aaaaaa;

    opacity: 0;

    animation: aparecerBotao .8s ease 2.2s forwards;

    transition: .3s;
}

@keyframes aparecerBotao {
    from {
        opacity: 0;
        transform: translateY(35px) scale(.7);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

button:hover {
    transform: translateY(-5px) scale(1.06);

    background: linear-gradient(
        145deg,
        #333333,
        #777777,
        #111111
    );

    box-shadow:
        0 0 20px #ffffff,
        0 0 40px #999999;
}

/* DESAPARECIMENTO AO ENTRAR */

.castelo.aberto .conteudo {
    opacity: 0;
    transition: opacity .8s ease;
}

/* CELULAR */

@media (max-width: 600px) {

    .folha {
        background-size: 100vw 100dvh;
    }

    #nome {
        font-size: clamp(27px, 8vw, 45px);
        letter-spacing: 1px;
        gap: 1px;
    }

    .frase {
        letter-spacing: 1px;
    }

    button {
        padding: 15px 23px;
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="castelo" id="castelo">

    <div class="portao">
        <div class="folha esquerda"></div>
        <div class="folha direita"></div>
    </div>

    <div class="conteudo">

        <h1 id="nome"></h1>

        <p class="frase">
            Um mundo de conhecimento, criatividade e tecnologia
        </p>

        <button onclick="entrar()">
            ✨ ENTRAR NO MEU CASTELO ✨
        </button>

    </div>

</div>

<script>

/* ANIMAÇÃO DAS LETRAS */

const nome = "AMANDA SOUZA";

const elementoNome = document.getElementById("nome");

[...nome].forEach((letra, i) => {

    const span = document.createElement("span");

    span.textContent = letra === " " ? "\u00A0" : letra;

    span.style.animationDelay = (i * 0.15) + "s";

    elementoNome.appendChild(span);

});

/* ABERTURA DO CASTELO */

function entrar() {

    const castelo = document.getElementById("castelo");

    if (castelo.classList.contains("aberto")) return;

    castelo.classList.add("aberto");

    setTimeout(() => {
        window.location.href = "sobre.html";
    }, 2700);

}

</script>

</body>
</html>
