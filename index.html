
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelo Mágico | Amanda Souza</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #10051f;
    font-family: Georgia, serif;
}

.castelo {
    position: relative;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background:
      linear-gradient(180deg, rgba(15,4,30,.08), rgba(15,4,30,.48)),
      url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png")
      center center / cover no-repeat;
}

/* Brilho mágico */
.castelo::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(
      circle at center,
      transparent 20%,
      rgba(20, 3, 38, .38) 100%
    );
    z-index: 2;
}

/* Camadas da imagem que formam os portões */
.portao {
    position: absolute;
    inset: 0;
    display: flex;
    z-index: 3;
    pointer-events: none;
}

.folha {
    width: 50%;
    height: 100%;
    background-image: url("https://raw.githubusercontent.com/AmandaSouzaDev/castelo-magico-amanda/main/5f0ee79a-7ad7-480f-a32b-cb1cac9fa5eb.png");
    background-repeat: no-repeat;
    background-size: 100vw 100vh;
    transition: transform 2.5s cubic-bezier(.75, 0, .2, 1);
}

.esquerda {
    background-position: left center;
}

.direita {
    background-position: right center;
}

.castelo.aberto .esquerda {
    transform: translateX(-100%);
}

.castelo.aberto .direita {
    transform: translateX(100%);
}

/* Texto por cima da entrada */
.conteudo {
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    text-align: center;
    color: white;
    text-shadow: 0 3px 15px #160022;
}

.coroa {
    font-size: clamp(35px, 6vw, 65px);
    margin-bottom: 8px;
    filter: drop-shadow(0 0 12px #ffd76a);
}

h1 {
    font-size: clamp(34px, 7vw, 76px);
    color: #ffe6ff;
    letter-spacing: 4px;
    text-shadow:
      0 0 10px #e5aaff,
      0 0 25px #a83bff,
      0 0 45px #8c28ff;
}

.frase {
    font-size: clamp(14px, 2.5vw, 21px);
    margin-top: 14px;
    color: #fff0ff;
    letter-spacing: 2px;
}

button {
    margin-top: 32px;
    padding: 17px 38px;
    border: 2px solid #ffe5a0;
    border-radius: 50px;
    background: linear-gradient(135deg, #8b36cf, #d34db8, #7a2cc2);
    color: white;
    font-size: clamp(15px, 2vw, 20px);
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow:
      0 0 15px #d78cff,
      0 0 35px rgba(194, 91, 255, .65);
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 30px #ffb9ff;
}

.castelo.aberto .conteudo {
    opacity: 0;
    transition: opacity .8s ease;
}

/* Ajuste para telas pequenas */
@media (max-width: 600px) {
    .castelo {
        background-position: center center;
    }

    .folha {
        background-size: 100vw 100dvh;
    }

    h1 {
        letter-spacing: 2px;
    }

    button {
        padding: 15px 25px;
    }
}
</style>
</head>

<body>

<div class="castelo" id="castelo">

    <div class="portao">
        <div class="folha esquerda"></div>
        <div class="folha direita"></div>
    </div>

    <div class="conteudo">
        <div class="coroa">👑</div>

        <h1>AMANDA SOUZA</h1>

        <p class="frase">
            Um mundo de conhecimento, criatividade e tecnologia
        </p>

        <button onclick="entrar()">
            ✨ ENTRAR NO MEU CASTELO ✨
        </button>
    </div>

</div>

<script>
function entrar() {
    const castelo = document.getElementById("castelo");

    if (castelo.classList.contains("aberto")) return;

    castelo.classList.add("aberto");

    setTimeout(() => {
        window.location.href = "sobre.html";
    }, 2700);
}
</script>

</body>
</html>
